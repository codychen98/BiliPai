name: Dev APK

# Forks do not receive the upstream FCM or release-signing secrets, so the
# main Build workflow skips the APK. This job builds the smooth variant
# (debug-signed, no R8, same applicationId as release). Only release/dev are
# exported to outputs/bilipai, so the artifact is taken from the AGP apk dir.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: dev-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-smooth:
    name: Assemble smooth APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build smooth APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --max-workers=4 assembleSmooth; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Gradle assembleSmooth failed on attempt $attempt; retrying..."
            sleep $((attempt * 15))
          done
          find app/build/outputs -type f -name '*.apk' -print

      - name: Upload smooth APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPai-smooth
          path: app/build/outputs/apk/smooth/**/*.apk
          retention-days: 14
          if-no-files-found: error
